<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>终端画面预览（mock 数据源）</title>
<link rel="stylesheet" href="../renderer/player.css">
<style>
  /* 预览时不要 cursor:none，方便在浏览器里看清元素位置 */
  body { cursor: default; }
  .scen {
    position: fixed; right: 10px; top: 10px; z-index: 99;
    font: 12px/1.6 Consolas, monospace; color: #9fb2c9;
    background: rgba(0,0,0,.7); padding: 8px 12px; border-radius: 8px;
    white-space: pre; pointer-events: none;
  }
</style>
</head>
<body>
<div id="screen">

  <header>
    <div class="model">
      <span class="code" id="mCode">——</span>
      <span class="nm" id="mName"></span>
      <span class="op" id="pCode">——</span>
    </div>
    <div class="right" id="right">
      <span class="dot"></span>
      <span id="stateText">连接中</span>
    </div>
  </header>

  <div class="stage">
    <div class="layer" id="layerA">
      <img alt="" hidden>
      <video playsinline preload="auto" hidden></video>
    </div>
    <div class="layer" id="layerB">
      <img alt="" hidden>
      <video playsinline preload="auto" hidden></video>
    </div>

    <div class="wait" id="wait">
      <h1 id="waitTitle">正在获取内容</h1>
      <p id="waitText">正在连接服务器…</p>
      <div class="bar"><i id="waitBar"></i></div>
      <div class="hint" id="waitHint"></div>
    </div>

    <div id="hint" hidden><span class="spin"></span><span id="hintText"></span></div>
  </div>

  <footer>
    <div class="foot-left"><b id="cur">0</b><span>/</span><span id="total">0</span></div>
    <div class="dots" id="dots"></div>
    <div class="foot-right" id="clock"></div>
  </footer>

</div>

<div class="scen" id="scen"></div>

<script>
'use strict';
// ── mock 一个主进程，让 player.js 以为自己在 exe 里跑 ──
const SCN = new URLSearchParams(location.search).get('s') || '1';
const base = {
  op: 'OP30', server: 'http://127.0.0.1:8092', status: 'play', phase: 'idle',
  modelCode: '', modelId: '', pendingCode: '', seq: 3,
  done: 0, total: 0, missing: [], online: ['OP30'], linked: true, uptimeMs: 1000
};
let status = { ...base };

window.__flips = [];
window.vwi = {
  isTerminal: true,
  snapshot: async () => ({ op: 'OP30', dev: true, status, view: null }),
  onView: (cb) => { window.__pushView = cb; return () => {}; },
  onStatus: (cb) => { window.__pushStatus = cb; return () => {}; },
  flipped: (p) => { window.__flips.push(p); },
  log: (l, m) => console.log('[' + l + ']', m)
};
</script>

<script src="../renderer/player.js"></script>

<script>
'use strict';
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const ITEMS_A = [
  { url: 'fixtures/a.png', kind: 'image', dwellSec: 25, name: 'A 蓝' },
  { url: 'fixtures/b.png', kind: 'image', dwellSec: 25, name: 'B 红' },
  { url: 'fixtures/c.png', kind: 'image', dwellSec: 25, name: 'C 绿' }
];

const ITEMS_B = [
  { url: 'fixtures/c.png', kind: 'image', dwellSec: 25, name: 'C 绿' },
  { url: 'fixtures/b.png', kind: 'image', dwellSec: 25, name: 'B 红' }
];

async function pushView(items, modelCode, modelId, id) {
  if (!window.__pushView) return;
  await window.__pushView({ id: id || 1, modelCode, modelId, reason: 'switch', items });
}

function pushStatus(patch) {
  status = { ...status, ...patch };
  if (window.__pushStatus) window.__pushStatus(status);
}

const TITLES = {
  1: 'S1 正常播放：3 项，第 1 张',
  2: 'S2 自动翻页：1 秒后应到第 2 项',
  3: 'S3 整屏切换：X200(3项) → X210(2项)',
  4: 'S4 掉队告警：顶栏红字「内容未就绪」',
  5: 'S5 内容不全：空清单不黑屏',
  6: 'S6 准备中：画面照旧播，只挂角标',
  7: 'S7 离线：画面照常，顶栏转灰'
};
document.getElementById('scen').textContent = TITLES[SCN] || ('场景 ' + SCN);

(async function run() {
  await wait(120);   // 等 player.js 的 boot() 把回调注册好

  if (SCN === '1') {
    pushStatus({ status: 'play', modelCode: 'X200', modelId: 'm1', done: 3, total: 3 });
    await pushView(ITEMS_A, 'X200', 'm1', 1);

  } else if (SCN === '2') {
    const fast = ITEMS_A.map((it) => ({ ...it, dwellSec: 1 }));
    pushStatus({ status: 'play', modelCode: 'X200', modelId: 'm1', done: 3, total: 3 });
    await pushView(fast, 'X200', 'm1', 2);

  } else if (SCN === '3') {
    pushStatus({ status: 'play', modelCode: 'X200', modelId: 'm1', done: 3, total: 3 });
    await pushView(ITEMS_A, 'X200', 'm1', 3);
    await wait(900);                                   // 先让 A 播一会儿
    pushStatus({ status: 'play', modelCode: 'X210', modelId: 'm2', done: 2, total: 2 });
    await pushView(ITEMS_B, 'X210', 'm2', 4);

  } else if (SCN === '4') {
    pushStatus({ status: 'play', modelCode: 'X300', modelId: 'm3', done: 3, total: 3 });
    await pushView(ITEMS_A, 'X300', 'm3', 5);
    await wait(400);
    pushStatus({ status: 'stale', modelCode: 'X400', pendingCode: 'X400', done: 0, total: 11 });

  } else if (SCN === '5') {
    pushStatus({ status: 'incomplete', modelCode: 'X500', modelId: 'm5', done: 0, total: 0 });
    await pushView([], 'X500', 'm5', 6);

  } else if (SCN === '6') {
    pushStatus({ status: 'play', modelCode: 'X200', modelId: 'm1', done: 3, total: 3 });
    await pushView(ITEMS_A, 'X200', 'm1', 7);
    await wait(400);
    pushStatus({ status: 'preparing', pendingCode: 'X400', done: 7, total: 11 });

  } else if (SCN === '7') {
    pushStatus({ status: 'play', modelCode: 'X200', modelId: 'm1', done: 3, total: 3 });
    await pushView(ITEMS_A, 'X200', 'm1', 8);
    await wait(400);
    pushStatus({ status: 'offline', linked: false });
  }

  document.title = 'ready:' + SCN;
})();
</script>
</body>
</html>
